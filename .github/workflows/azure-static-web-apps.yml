name: Deploy AzureCraft to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: Build and deploy to Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage static content
        run: |
          rm -rf _site
          mkdir -p _site
          # Copy tracked files, excluding server/build files not needed by SWA
          rsync -a --exclude='.git' \
                   --exclude='.github' \
                   --exclude='server.js' \
                   --exclude='package.json' \
                   --exclude='package-lock.json' \
                   --exclude='scripts' \
                   --exclude='_site' \
                   ./ _site/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "_site"
          skip_app_build: true
          skip_api_build: true
